# MongoDB 配置文件
# 用於分散式系統的 Master MongoDB



# 安全配置
security:
  authorization: enabled

# 存儲配置
storage:
  dbPath: /data/db
  journal:
    enabled: true

# 日誌配置
systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  logRotate: reopen

# 進程管理
processManagement:
  fork: false

# 操作分析
operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 100