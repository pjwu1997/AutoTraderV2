# MongoDB 配置文件
# 用於分散式系統的 Master MongoDB

# 網路配置
net:
  port: 27017
  bindIp: 0.0.0.0  # 允許所有IP連接

# 安全配置
security:
  authorization: enabled

# 存儲配置
storage:
  dbPath: /data/db
  journal:
    enabled: true

# 日誌配置
systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  logRotate: reopen

# 進程管理
processManagement:
  fork: false

# 操作分析
operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 100