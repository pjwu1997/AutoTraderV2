# Slave VM Docker Compose 配置模板
# 每台 Slave VM 都使用此模板，透過環境變數區分

version: '3.8'

services:
  # 分散式資料收集器 (REST API) - 連接到 Master MongoDB
  data-fetcher:
    build:
      context: ../../SlaveVM/data_fetcher
      dockerfile: Dockerfile
    container_name: ${SLAVE_ID}-data-fetcher
    environment:
      - SLAVE_ID=${SLAVE_ID}
      - SYMBOLS=${SYMBOLS}
      - MASTER_URL=${MASTER_URL}
      - EXCHANGE_NAME=binance
      - MONGO_URI=${MONGO_URI}  # 指向 Master VM MongoDB
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      - MONGO_USERNAME=${MONGO_USERNAME}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_AUTH_SOURCE=${MONGO_AUTH_SOURCE}
      - TIMEFRAME=5m
      - FETCH_INTERVAL=${FETCH_INTERVAL:-60}
      - BATCH_SIZE=${BATCH_SIZE:-15}
      - RATE_LIMIT_DELAY=${RATE_LIMIT_DELAY:-0.1}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
    volumes:
      - ../../Config/slaves/${SLAVE_ID}.env:/app/.env:ro
      - ./logs:/app/logs  # 本地日誌目錄
    networks:
      - slave-net
    restart: unless-stopped
    depends_on:
      - health-checker
    deploy:
      resources:
        limits:
          memory: 1G  # 增加記憶體限制 (處理更多 symbols)
          cpus: '0.75'
        reservations:
          memory: 512M
          cpus: '0.5'

  # K線 WebSocket 收集器 (即時資料) - 連接到 Master MongoDB
  kline-websocket:
    build:
      context: ../../SlaveVM/websockets
      dockerfile: Dockerfile.kline
    container_name: ${SLAVE_ID}-kline-ws
    environment:
      - SLAVE_ID=${SLAVE_ID}
      - SYMBOLS=${SYMBOLS}
      - MONGO_URI=${MONGO_URI}  # 指向 Master VM MongoDB
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      - MONGO_USERNAME=${MONGO_USERNAME}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_AUTH_SOURCE=${MONGO_AUTH_SOURCE}
      - KLINE_INTERVAL=5m
      - WS_URL=wss://fstream.binance.com/ws/
    volumes:
      - ./logs:/app/logs
    networks:
      - slave-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M  # 增加記憶體限制 (處理更多 symbols)
          cpus: '0.5'

  # 清算 WebSocket 收集器 - 連接到 Master MongoDB
  liquidation-websocket:
    build:
      context: ../../SlaveVM/websockets  
      dockerfile: Dockerfile.liquidation
    container_name: ${SLAVE_ID}-liquidation-ws
    environment:
      - SLAVE_ID=${SLAVE_ID}
      - SYMBOLS=${SYMBOLS}
      - MONGO_URI=${MONGO_URI}  # 指向 Master VM MongoDB
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      - MONGO_USERNAME=${MONGO_USERNAME}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_AUTH_SOURCE=${MONGO_AUTH_SOURCE}
      - WS_URL=wss://fstream.binance.com/ws/
    volumes:
      - ./logs:/app/logs
    networks:
      - slave-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M  # 增加記憶體限制 (處理更多 symbols)
          cpus: '0.5'

  # 健康檢查器
  health-checker:
    build:
      context: ../../SlaveVM/health_checker
      dockerfile: Dockerfile
    container_name: ${SLAVE_ID}-health
    ports:
      - "${HEALTH_PORT:-8081}:8081"
    environment:
      - SLAVE_ID=${SLAVE_ID}
      - MASTER_URL=${MASTER_URL}
      - MONGO_URI=${MONGO_URI}
      - HEALTH_PORT=8081
    networks:
      - slave-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'

networks:
  slave-net:
    driver: bridge