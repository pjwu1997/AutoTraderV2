# Slave VM Docker Compose 配置模板
# 每台 Slave VM 都使用此模板，透過環境變數區分

version: '3.8'

services:
  # 統一資料收集器 (1分鐘聚合) - 連接到 Master MongoDB
  unified-collector:
    build:
      context: ../../..
      dockerfile: DistributedSystem/SlaveVM/data_fetcher/Dockerfile
    container_name: ${SLAVE_ID}-unified-collector
    environment:
      - SLAVE_ID=${SLAVE_ID}
      - SYMBOLS=${SYMBOLS}
      - MASTER_URL=${MASTER_URL}
      - EXCHANGE_NAME=binance
      - MONGO_URI=${MONGO_URI}  # 指向 Master VM MongoDB
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      - MONGO_USERNAME=${MONGO_USERNAME}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_AUTH_SOURCE=${MONGO_AUTH_SOURCE}
      - TIMEFRAME=1m  # Changed to 1m for precision matching WebSocket data
      - FETCH_INTERVAL=${FETCH_INTERVAL:-60}
      - BATCH_SIZE=${BATCH_SIZE:-15}
      - RATE_LIMIT_DELAY=${RATE_LIMIT_DELAY:-0.1}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
    volumes:
      - ../../Config/slaves/${SLAVE_ID}.env:/app/.env:ro
      - ./logs:/app/logs  # 本地日誌目錄
    networks:
      - slave-net
    restart: unless-stopped
    # depends_on:
    #   - health-checker
    deploy:
      resources:
        limits:
          memory: 1.5G  # 增加記憶體限制 (統一收集器需要更多資源)
          cpus: '1.0'
        reservations:
          memory: 768M
          cpus: '0.75'

  # K線 WebSocket 收集器 (1分鐘即時資料) - 已實現
  kline-websocket:
    build:
      context: ../../..
      dockerfile: DistributedSystem/SlaveVM/websockets/Dockerfile.kline
    container_name: ${SLAVE_ID}-kline-ws
    environment:
      - SLAVE_ID=${SLAVE_ID}
      - SYMBOLS=${SYMBOLS}
      - MASTER_URL=${MASTER_URL}
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      - MONGO_USERNAME=${MONGO_USERNAME}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_AUTH_SOURCE=${MONGO_AUTH_SOURCE}
      - KLINE_INTERVAL=1m
      - KLINE_SPOT_WS_URL=wss://stream.binance.com:9443/ws/{streams}
      - KLINE_FUTURES_WS_URL=wss://fstream.binance.com/ws/{streams}
    volumes:
      - ./logs:/app/logs
    networks:
      - slave-net
    restart: unless-stopped
    depends_on:
      - unified-collector
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # 清算 WebSocket 收集器 (1分鐘即時資料) - 已實現
  liquidation-websocket:
    build:
      context: ../../..
      dockerfile: DistributedSystem/SlaveVM/websockets/Dockerfile.liquidation
    container_name: ${SLAVE_ID}-liquidation-ws
    environment:
      - SLAVE_ID=${SLAVE_ID}
      - SYMBOLS=${SYMBOLS}
      - MASTER_URL=${MASTER_URL}
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      - MONGO_USERNAME=${MONGO_USERNAME}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_AUTH_SOURCE=${MONGO_AUTH_SOURCE}
      - LIQUIDATION_WS_URL=wss://fstream.binance.com/ws/!forceOrder@arr
      - LIQUIDATION_CLEANUP_MINUTES=5
      - LIQUIDATION_RECONNECT_INTERVAL=86100
    volumes:
      - ./logs:/app/logs
    networks:
      - slave-net
    restart: unless-stopped
    depends_on:
      - unified-collector
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # 健康檢查器
  health-checker:
    build:
      context: ../../..
      dockerfile: DistributedSystem/SlaveVM/health_checker/Dockerfile
    container_name: ${SLAVE_ID}-health
    ports:
      - "${HEALTH_PORT:-8081}:8081"
    environment:
      - SLAVE_ID=${SLAVE_ID}
      - MASTER_URL=${MASTER_URL}
      - MONGO_URI=${MONGO_URI}
      - HEALTH_PORT=8081
    networks:
      - slave-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'

networks:
  slave-net:
    driver: bridge