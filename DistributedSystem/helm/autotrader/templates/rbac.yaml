{{- if .Values.cronjob.enabled -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "autotrader.fullname" . }}-config-updater
  labels:
    {{- include "autotrader.labels" . | nindent 4 }}
    app.kubernetes.io/component: config-updater
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "autotrader.fullname" . }}-config-updater-role
  labels:
    {{- include "autotrader.labels" . | nindent 4 }}
    app.kubernetes.io/component: config-updater
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "create", "update", "replace", "patch"]
- apiGroups: ["apps"]
  resources: ["statefulsets"]
  verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "autotrader.fullname" . }}-config-updater-rb
  labels:
    {{- include "autotrader.labels" . | nindent 4 }}
    app.kubernetes.io/component: config-updater
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "autotrader.fullname" . }}-config-updater-role
subjects:
- kind: ServiceAccount
  name: {{ include "autotrader.fullname" . }}-config-updater
  namespace: {{ .Release.Namespace }}
{{- end }}
