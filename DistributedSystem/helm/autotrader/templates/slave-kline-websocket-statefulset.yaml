apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "autotrader.fullname" . }}-slave-kline-websocket
  labels:
    {{- include "autotrader.labels" . | nindent 4 }}
    app.kubernetes.io/component: slave-kline-websocket
spec:
  replicas: {{ .Values.slave.replicaCount }}
  serviceName: {{ include "autotrader.fullname" . }}-slave-kline-websocket
  selector:
    matchLabels:
      {{- include "autotrader.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: slave-kline-websocket
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "autotrader.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: slave-kline-websocket
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "autotrader.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
      - name: config
        emptyDir: {}
      {{- range $i, $e := until (int .Values.slave.replicaCount) }}
      - name: symbols-config-{{ $i }}
        configMap:
          name: {{ include "autotrader.fullname" $ }}-slave-symbols-{{ $i }}
      {{- end }}
      initContainers:
        - name: copy-symbols
          image: busybox
          command:
            - /bin/sh
            - -c
            - |
              POD_ORDINAL=$((${HOSTNAME##*-}))
              cp /config-templates/${POD_ORDINAL}/symbols.csv /config/symbols.csv
          volumeMounts:
          - name: config
            mountPath: /config
          {{- range $i, $e := until (int .Values.slave.replicaCount) }}
          - name: symbols-config-{{ $i }}
            mountPath: /config-templates/{{ $i }}
          {{- end }}
      containers:
        - name: kline-websocket
          image: "{{ .Values.slave.image.kline_websocket.repository }}:{{ .Values.slave.image.kline_websocket.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.slave.image.kline_websocket.pullPolicy }}
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: autotrader-mongodb-secret
                  key: mongo-uri
            - name: MONGO_DB_NAME
              value: {{ .Values.slave.mongo_db_name | quote }}
            - name: HEALTH_PORT
              value: {{ .Values.slave.healthPort | quote }}
            - name: TEST_MODE
              value: {{ .Values.slave.env.TEST_MODE | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.slave.env.LOG_LEVEL | quote }}
          volumeMounts:
          - name: config
            mountPath: /config
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
