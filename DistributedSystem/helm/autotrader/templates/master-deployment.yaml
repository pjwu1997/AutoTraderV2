apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autotrader.fullname" . }}-master
  labels:
    {{- include "autotrader.labels" . | nindent 4 }}
    app.kubernetes.io/component: master
spec:
  replicas: {{ .Values.master.replicaCount }}
  selector:
    matchLabels:
      {{- include "autotrader.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: master
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "autotrader.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: master
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "autotrader.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: master
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.master.image.repository }}:{{ .Values.master.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.master.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.master.port }}
              protocol: TCP
          env:
            - name: MASTER_PORT
              value: "{{ .Values.master.port }}"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: autotrader-mongodb-secret
                  key: mongo-uri
            - name: MONGO_DB_NAME
              value: {{ .Values.master.env.MONGO_DB_NAME | quote }}
            - name: MONGO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: autotrader-mongodb-secret
                  key: mongo-root-user
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: autotrader-mongodb-secret
                  key: mongo-root-password
            - name: NUM_SLAVES
              value: {{ .Values.slave.replicaCount | quote }}
            - name: TEST_MODE
              value: {{ .Values.master.env.TEST_MODE | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.master.env.LOG_LEVEL | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "autotrader.fullname" . }}-master
  labels:
    {{- include "autotrader.labels" . | nindent 4 }}
    app.kubernetes.io/component: master
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.master.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "autotrader.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: master
