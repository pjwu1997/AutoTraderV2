apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "autotrader.fullname" . }}-slave-data-fetcher
  labels:
    {{- include "autotrader.labels" . | nindent 4 }}
    app.kubernetes.io/component: slave-data-fetcher
spec:
  replicas: {{ .Values.slave.replicaCount }}
  serviceName: {{ include "autotrader.fullname" . }}-slave-data-fetcher
  selector:
    matchLabels:
      {{- include "autotrader.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: slave-data-fetcher
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "autotrader.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: slave-data-fetcher
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "autotrader.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
      {{- range $i, $e := until (int .Values.slave.replicaCount) }}
        - name: symbols-config-{{ $i }}
          configMap:
            name: {{ include "autotrader.fullname" $ }}-slave-symbols-{{ $i }}
      {{- end }}
      containers:
        - name: data-fetcher
          image: "{{ .Values.slave.image.data_fetcher.repository }}:{{ .Values.slave.image.data_fetcher.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.slave.image.data_fetcher.pullPolicy }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SLAVE_ID
              value: "slave-$((${POD_NAME##*-}))"
            - name: MASTER_URL
              value: "http://{{ include "autotrader.fullname" . }}-master:{{ .Values.master.port }}"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: autotrader-mongodb-secret
                  key: mongo-uri
            - name: MONGO_DB_NAME
              value: {{ .Values.slave.mongo_db_name | quote }}
            - name: HEALTH_PORT
              value: {{ .Values.slave.healthPort | quote }}
            - name: TEST_MODE
              value: {{ .Values.slave.env.TEST_MODE | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.slave.env.LOG_LEVEL | quote }}

          volumeMounts:
          {{- range $i, $e := until (int .Values.slave.replicaCount) }}
            - name: symbols-config-{{ $i }}
              mountPath: /config/{{ $i }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
