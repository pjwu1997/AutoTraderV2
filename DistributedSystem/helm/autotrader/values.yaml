# Default values for autotrader chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: w24351789/autotrader-master
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the
  # following lines, adjust them as needed, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: 
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: node-role.kubernetes.io/control-plane
          operator: DoesNotExist

master:
  replicaCount: 1
  image:
    repository: w24351789/autotrader-master
    pullPolicy: Always
    tag: v2
  port: 8080
  env:
    MONGO_DB_NAME: "trading_data"
    NUM_SLAVES: "3" # This should match the slave.replicaCount
    TEST_MODE: "false"
    LOG_LEVEL: "INFO"

slave:
  replicaCount: 3
  mongo_db_name: "trading_data"
  image:
    data_fetcher:
      repository: w24351789/autotrader-data-fetcher
      pullPolicy: Always
      tag: v2
    kline_websocket:
      repository: w24351789/autotrader-kline-websocket
      pullPolicy: Always
      tag: v2
    liquidation_websocket:
      repository: w24351789/autotrader-liquidation-websocket
      pullPolicy: Always
      tag: v2
    health_checker:
      repository: w24351789/autotrader-health-checker
      pullPolicy: Always
      tag: v2
  healthPort: 8081
  env:
    TEST_MODE: "false"
    LOG_LEVEL: "DEBUG"

cronjob:
  enabled: true
  schedule: "0 0 * * *" # Daily at midnight
  image:
    repository: w24351789/autotrader-config-updater
    pullPolicy: Always
    tag: v2
